specVersion: "4.0"
metadata:
  name: "@sap-samples/ui5con-2025-theming-workshop-no-theming"
type: application
framework:
  name: OpenUI5
  version: 1.136.1
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    - name: ui5-middleware-livereload
      afterMiddleware: compression
