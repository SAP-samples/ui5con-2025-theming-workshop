specVersion: "4.0"
metadata:
  name: "@sap-samples/ui5con-2025-theming-workshop-library-less"
type: application
framework:
  name: OpenUI5
  version: 1.136.1
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
    - name: ui5-tooling-less-task
      afterTask: replaceVersion
      configuration:
        lessToCompile:
          - "**/library.less"
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    - name: ui5-middleware-livereload
      afterMiddleware: compression
    - name: ui5-tooling-less-middleware
      afterMiddleware: compression
      configuration:
        lessToCompile:
          - "**/library.less"
